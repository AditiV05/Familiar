<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/F1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar</title>

    <meta
      name="description"
      content="A quiet place to read, write, and think out loud."
    />
    <meta name="theme-color" content="#5c1a2b" />

    <!-- Open Graph: how the link previews on WhatsApp, LinkedIn, etc.
         These are the site-level defaults. Per-article tags are injected
         for crawlers by middleware.js -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Familiar" />
    <meta property="og:title" content="Familiar" />
    <meta
      property="og:description"
      content="A quiet place to read, write, and think out loud."
    />
    <meta
      property="og:image"
      content="https://familiar-blog.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Familiar" />
    <meta property="og:url" content="https://familiar-blog.vercel.app/" />

    <!-- Twitter/X uses its own tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Familiar" />
    <meta
      name="twitter:description"
      content="A quiet place to read, write, and think out loud."
    />
    <meta
      name="twitter:image"
      content="https://familiar-blog.vercel.app/og-image.png"
    />
    <meta name="twitter:image:alt" content="Familiar" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
